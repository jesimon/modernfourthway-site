<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Thank you — The Modern Fourth Way</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:radial-gradient(ellipse at 50% 38%, #2a3060 0%, #1c2144 45%, #151936 100%);
    font-family:Georgia,serif;color:#dcd8c8;text-align:center;padding:24px;}
  .card{max-width:540px;}
  h1{color:#e8c88c;font-weight:normal;font-size:30px;margin:0 0 14px;}
  p{line-height:1.65;opacity:.9;}
  a.btn,span.btn{display:inline-block;margin-top:22px;padding:14px 34px;border:1px solid rgba(232,200,140,.6);
    border-radius:8px;color:#e8c88c;text-decoration:none;font-size:17px;letter-spacing:.04em;}
  a.btn:hover{background:rgba(232,200,140,.08);}
  span.btn{opacity:.55;border-style:dashed;cursor:default;}
  .pulse{animation:pulse 2.2s ease-in-out infinite;}
  @keyframes pulse{0%,100%{opacity:.45}50%{opacity:.8}}
  .note{font-size:13px;opacity:.6;margin-top:26px;font-style:italic;}
  .home{margin-top:34px;font-size:14px;}
  .home a{color:#dcd8c8;}
</style><!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=AW-18462269872"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'AW-18462269872');
  gtag('config', 'G-03VK7G4EK9');
</script>
</head><body><div class="card">
<h1>Thank you.</h1>
<p>Your copy of <em>The Modern Fourth Way</em> is on its way to being yours. The EPUB opens in
Apple Books, Kindle (via <a href="https://www.amazon.com/sendtokindle" target="_blank" rel="noopener">Send&nbsp;to&nbsp;Kindle</a>), Kobo, and every standard reader.</p>
<span class="btn pulse" id="btn">Preparing your download&hellip;</span>
<p class="note" id="note">This usually takes a few seconds.</p>
<p class="home"><a href="/">modernfourthway.org</a></p>
</div>
<script>
(function(){
  var SVC = 'https://mfw-delivery.onrender.com';
  var sid = new URLSearchParams(location.search).get('session_id');
  var btn = document.getElementById('btn'), note = document.getElementById('note');
  if (!sid) { location.replace('/'); return; }
  var tries = 0;
  function ready(email){
    try { gtag('event', 'conversion', { 'send_to': 'AW-18462269872/-UQhCPvE1f0cELDDv-NE',
      'value': 19.99, 'currency': 'USD', 'transaction_id': sid }); } catch(e){}
    var a = document.createElement('a');
    a.className = 'btn'; a.id = 'btn';
    a.href = SVC + '/download?session_id=' + encodeURIComponent(sid);
    a.textContent = 'Download the eBook';
    btn.replaceWith(a);
    note.innerHTML = 'This page stays valid &mdash; bookmark it to re-download on another device, and we&rsquo;ve emailed this link to ' + (email || 'you') + ' as well.' +
      (email ? '<br>A receipt has been emailed to ' + email.replace(/</g,'&lt;') + '.' : '');
  }
  function denied(){
    btn.classList.remove('pulse');
    btn.textContent = 'Purchase not found';
    note.textContent = 'This page needs a completed purchase. If you just paid, use the link from your receipt or contact info@modernfourthway.org.';
  }
  function attempt(){
    tries++;
    fetch(SVC + '/verify?session_id=' + encodeURIComponent(sid))
      .then(function(r){ if (r.ok) return r.json().then(function(d){ ready(d.email); });
                         else denied(); })
      .catch(function(){
        if (tries < 10) { note.textContent = 'Warming up the delivery service\u2026 a few more seconds.'; setTimeout(attempt, 7000); }
        else { btn.classList.remove('pulse'); btn.textContent = 'Taking longer than usual';
               note.innerHTML = 'Please refresh this page in a minute &mdash; your purchase is safe and this link stays valid.'; }
      });
  }
  attempt();
})();
</script></body></html>
