<title>The Great Map — The Modern Fourth Way</title>
<style>
:root{--ink:#151936;--panel:#1c2144;--gold:#e8c88c;--ember:#ffb45e;--moon:#efe9da;--slate:#8a91b8;}
html,body{margin:0;padding:0;height:100%;width:100%;position:fixed;overflow:hidden;
overscroll-behavior:none;background:radial-gradient(ellipse at 50% 35%, #232952 0%, var(--ink) 55%, #101328 100%);
font-family:Georgia,'Times New Roman',serif;}
#stage{position:fixed;inset:0;width:100%;height:100%;touch-action:none;cursor:grab;}
#stage.dragging{cursor:grabbing;}
#stage svg{width:100%;height:100%;display:block;}
.hud{position:fixed;z-index:10;pointer-events:none;}
#topbar{top:0;left:0;right:0;padding:14px 20px;display:flex;justify-content:space-between;align-items:baseline;
background:linear-gradient(rgba(16,19,40,.85), rgba(16,19,40,0));}
#topbar a{pointer-events:auto;color:var(--gold);text-decoration:none;font-size:14px;letter-spacing:.04em;}
#topbar a:hover{text-decoration:underline;}
#topbar .ttl{color:var(--moon);font-style:italic;font-size:14px;opacity:.85;}
#hint{bottom:18px;left:20px;font-family:Avenir,'Segoe UI',system-ui,sans-serif;font-size:10px;
letter-spacing:.14em;text-transform:uppercase;color:var(--slate);max-width:60vw;line-height:1.8;}
#controls{bottom:16px;right:16px;display:flex;flex-direction:column;gap:8px;pointer-events:auto;}
#controls button{width:46px;height:46px;border-radius:8px;background:rgba(21,25,54,.85);
border:1px solid rgba(232,200,140,.55);color:var(--gold);font-size:20px;line-height:1;cursor:pointer;
font-family:Georgia,serif;backdrop-filter:blur(4px);}
#controls button:active{background:rgba(232,200,140,.25);}
#controls button.fit{font-size:11px;letter-spacing:.08em;font-family:Avenir,'Segoe UI',system-ui,sans-serif;}
#zoomlvl{position:fixed;bottom:22px;right:74px;color:var(--slate);font-size:11px;
font-family:Avenir,'Segoe UI',system-ui,sans-serif;letter-spacing:.06em;}
@media (max-width:640px){ #hint{display:none;} #topbar .ttl{display:none;} }
</style>

  <text class="st32" transform="translate(526.8 88)"><tspan x="0" y="0">THE GREAT MAP OF THE MODERN FOURTH WAY</tspan></text>
  <text class="st20" transform="translate(931.9 134)"><tspan x="0" y="0">Waking up in ordinary life — the whole journey in one figure</tspan></text>
  <text class="st27" transform="translate(1007.979 170)"><tspan x="0" y="0">Every concept, law, practice, and process of the book — and nothing more</tspan></text>

  <text class="st36" transform="translate(2319.77 588)"><tspan x="0" y="0">do — one level up</tspan></text>
  <circle class="st73" cx="432" cy="1030" r="6.5"/>
  <text class="st43" transform="translate(208.4126 1035)"><tspan x="0" y="0">IDENTIFICATION — attention</tspan></text>
  <text class="st43" transform="translate(247.7 1054.4301)"><tspan x="0" y="0">flows out and is captured</tspan></text>
  <circle class="st73" cx="520" cy="1370" r="6.5"/>
  <text class="st43" transform="translate(272.135 1375)"><tspan x="0" y="0">THE DREAM — waking sleep, eyes</tspan></text>
  <text class="st43" transform="translate(464.3237 1394.4301)"><tspan x="0" y="0">open</tspan></text>
  <circle class="st73" cx="600" cy="1558" r="6.5"/>
  <text class="st43" transform="translate(369.8564 1563)"><tspan x="0" y="0">the crowd CHURNS — many I’s,</tspan></text>
  <text class="st43" transform="translate(427.198 1582.4301)"><tspan x="0" y="0">each calling itself “you”</tspan></text>
  <circle class="st73" cx="958" cy="2290" r="6.5"/>
  <text class="st43" transform="translate(767.7385 2295)"><tspan x="0" y="0">BUFFERS seal the cracks;</tspan></text>
  <text class="st43" transform="translate(748.332 2314.4299)"><tspan x="0" y="0">CONSCIENCE waits beneath</tspan></text>
  <text class="st33" transform="translate(338.7 646.9) rotate(79.5) skewX(-.6)"><tspan x="0" y="0">THE DESCENT — Part I: the situation</tspan></text>
  <circle class="st70" cx="1990" cy="2070" r="11"/>
  <text class="st7" transform="translate(2014 2060)"><tspan x="0" y="0">MAN 4</tspan></text>
  <text class="st39" transform="translate(2014 2080)"><tspan x="0" y="0">the aim; the deputy</tspan></text>
  <text class="st39" transform="translate(2014 2097.4199)"><tspan x="0" y="0">steward holds the empty</tspan></text>
  <text class="st39" transform="translate(2014 2114.8401)"><tspan x="0" y="0">seat</tspan></text>
  <circle class="st70" cx="2120" cy="1690" r="11"/>
  <text class="st7" transform="translate(2144 1680)"><tspan x="0" y="0">MAN 5</tspan></text>
  <text class="st39" transform="translate(2144 1700)"><tspan x="0" y="0">unity — the permanent I</tspan></text>
  <circle class="st70" cx="2218" cy="1310" r="11"/>
  <text class="st7" transform="translate(2242 1300)"><tspan x="0" y="0">MAN 6</tspan></text>
  <text class="st39" transform="translate(2242 1320)"><tspan x="0" y="0">every connection live —</tspan></text>
  <text class="st39" transform="translate(2242 1337.42)"><tspan x="0" y="0">the threshold</tspan></text>
  <circle class="st70" cx="2290" cy="950" r="11"/>
  <text class="st7" transform="translate(2314 940)"><tspan x="0" y="0">MAN 7</tspan></text>
  <text class="st39" transform="translate(2314 960)"><tspan x="0" y="0">CRYSTALLIZED — one will;</tspan></text>
  <text class="st39" transform="translate(2314 977.4199)"><tspan x="0" y="0">what is built cannot be</tspan></text>
  <text class="st39" transform="translate(2314 994.8401)"><tspan x="0" y="0">taken</tspan></text>
  <text class="st5" transform="translate(2030 2226)"><tspan x="0" y="0">THE ASCENT — crystallization, rung by rung</tspan></text>
  <rect class="st17" x="360" y="300" width="800" height="272" rx="16" ry="16"/>
  <text class="st35" transform="translate(400 344)"><tspan x="0" y="0">IN THE BEGINNING</tspan></text>
  <text class="st11" transform="translate(400 382)"><tspan x="0" y="0">THIS — the one awareness, prior to every story. What you</tspan></text>
  <text class="st11" transform="translate(400 402.8)"><tspan x="0" y="0">are was never born into the machine; it only fell asleep</tspan></text>
  <text class="st11" transform="translate(400 423.5)"><tspan x="0" y="0">inside one.</tspan></text>
  <text class="st37" transform="translate(400 454.3)"><tspan x="0" y="0">The descent is not a mistake. Every complete map draws the</tspan></text>
  <text class="st37" transform="translate(400 473.7)"><tspan x="0" y="0">same figure — down, a bottom, a turn, up — and the sleep is</tspan></text>
  <text class="st37" transform="translate(400 493.2)"><tspan x="0" y="0">only the finished first half.</tspan></text>
  <rect class="st17" x="1440" y="300" width="880" height="272" rx="16" ry="16"/>
  <text class="st35" transform="translate(1480 344)"><tspan x="0" y="0">THE RETURN — AND THE GIFT</tspan></text>
  <text class="st41" transform="translate(1480 382)"><tspan x="0" y="0">At the edge of the map, effort meets its limit and the doer is</tspan></text>
  <text class="st41" transform="translate(1480 401.4299)"><tspan x="0" y="0">seen through. Who am I? — the seeker turns, and finds only THIS.</tspan></text>
  <text class="st41" transform="translate(1480 420.86)"><tspan x="0" y="0">What climbed was awareness all along; there was never anywhere to</tspan></text>
  <text class="st41" transform="translate(1480 440.29)"><tspan x="0" y="0">go.</tspan></text>
  <text class="st22" transform="translate(1480 467.72)"><tspan x="0" y="0">Yet the journey was not for nothing: a crystallized being comes</tspan></text>
  <text class="st22" transform="translate(1480 487.15)"><tspan x="0" y="0">back — experience made permanent, awareness awake inside a life.</tspan></text>

  <text class="st2" transform="translate(1147.3501 596)"><tspan x="0" y="0">THE ENNEAGRAM — the two laws in one figure;</tspan></text>
  <text class="st6" transform="translate(1099.0649 616)"><tspan x="0" y="0">the flat circle is the top-down view of a spiral: do arrives one level up</tspan></text>
  <rect class="st17" x="620" y="1180" width="440" height="400" rx="16" ry="16"/>
  <text class="st28" transform="translate(730.2148 1222)"><tspan x="0" y="0">THE LAW OF THREE</tspan></text>
  <path class="st59" d="M840,1282l-96,150h192l-96-150Z"/>
  <text class="st39" transform="translate(823.2549 1270)"><tspan x="0" y="0">active</tspan></text>
  <text class="st39" transform="translate(715.1194 1452)"><tspan x="0" y="0">passive</tspan></text>
  <text class="st39" transform="translate(909.3926 1452)"><tspan x="0" y="0">neutralizing</tspan></text>
  <text class="st46" transform="translate(714.4878 1478)"><tspan x="0" y="0">Nothing happens without a third force. Two</tspan></text>
  <text class="st46" transform="translate(693.0518 1495.42)"><tspan x="0" y="0">forces alone are a stalemate — and AWARENESS is</tspan></text>
  <text class="st46" transform="translate(706.4644 1512.84)"><tspan x="0" y="0">the third force you carry into any deadlock you</tspan></text>
  <text class="st46" transform="translate(723.6284 1530.26)"><tspan x="0" y="0">own. Six orders of triad govern all doing.</tspan></text>
  <rect class="st17" x="1540" y="1180" width="440" height="400" rx="16" ry="16"/>
  <text class="st28" transform="translate(1637.4854 1222)"><tspan x="0" y="0">THE LAW OF OCTAVES</tspan></text>

  <text class="st10" transform="translate(1696.624 1284)"><tspan x="0" y="0">mi–fa</tspan></text>
  <text class="st10" transform="translate(1893.6113 1284)"><tspan x="0" y="0">si–do</tspan></text>
  <text class="st46" transform="translate(1608.5164 1400)"><tspan x="0" y="0">Every process stalls at two INTERVALS; a SHOCK —</tspan></text>
  <text class="st46" transform="translate(1629.197 1417.42)"><tspan x="0" y="0">force from outside the line — carries it across.</tspan></text>
  <text class="st46" transform="translate(1626.0581 1434.84)"><tspan x="0" y="0">The first arrives at the gap; the second must be</tspan></text>
  <text class="st46" transform="translate(1612.8613 1452.26)"><tspan x="0" y="0">placed in advance. Nothing finishes by momentum.</tspan></text>
  <text class="st9" transform="translate(1593.0342 1548)"><tspan x="0" y="0">why everything that starts, stops — and how to finish anyway</tspan></text>
  <line class="st60" x1="1300" y1="2280" x2="1300" y2="780"/>
  <text class="st30" transform="translate(1101.7852 752)"><tspan x="0" y="0">THE TURN — Part III: the method, hour by hour</tspan></text>
  <line class="st62" x1="1268" y1="2190" x2="1332" y2="2190"/>
  <text class="st29" transform="translate(1074.1804 2187)"><tspan x="0" y="0">SELF-OBSERVATION — observe</tspan></text>
  <text class="st29" transform="translate(1105.9797 2203.75)"><tspan x="0" y="0">before you change anything</tspan></text>
  <line class="st62" x1="1268" y1="2075" x2="1332" y2="2075"/>
  <text class="st29" transform="translate(1342 2072)"><tspan x="0" y="0">THE STOP — the whole</tspan></text>
  <text class="st29" transform="translate(1342 2088.75)"><tspan x="0" y="0">machine halted</tspan></text>
  <text class="st29" transform="translate(1342 2105.5)"><tspan x="0" y="0">mid-gesture, and seen</tspan></text>

  <circle class="st69" cx="1300" cy="1500" r="15"/>
  <text class="st21" transform="translate(1342 1476)"><tspan x="0" y="0">SELF-REMEMBERING —</tspan></text>
  <text class="st21" transform="translate(1342 1494.09)"><tspan x="0" y="0">attention flowing two</tspan></text>
  <text class="st21" transform="translate(1342 1512.1801)"><tspan x="0" y="0">ways at once</tspan></text>
  <text class="st12" transform="translate(1342 1538)"><tspan x="0" y="0">ten honest seconds of</tspan></text>

  <line class="st61" x1="1272" y1="1420" x2="1300" y2="1420"/>
  <text class="st23" transform="translate(1188.0361 1424)"><tspan x="0" y="0">1 · sleep in bed</tspan></text>

  <text class="st23" transform="translate(1126.729 1310)"><tspan x="0" y="0">4 · objective consciousness</tspan></text>
  <text class="st16" transform="translate(1140.875 1268)"><tspan x="0" y="0">THE FOUR STATES</tspan></text>
  <path class="st64" d="M1300,1280v-480"/>
  <line class="st60" x1="1300" y1="800" x2="1300" y2="780"/>
  <text class="st6" transform="translate(1089.2842 1592)"><tspan x="0" y="0">the turn does not happen by</tspan></text>
  <text class="st6" transform="translate(1105.1597 1609.42)"><tspan x="0" y="0">itself — you are the shock</tspan></text>
  <rect class="st17" x="620" y="1660" width="440" height="600" rx="16" ry="16"/>
  <text class="st45" transform="translate(658.3257 1702)"><tspan x="0" y="0">THE ENGINE — Part V: transformation</tspan></text>
  <text class="st2" transform="translate(650 1742)"><tspan x="0" y="0">FIRST FOOD — what you eat</tspan></text>
  <text class="st44" transform="translate(650 1761)"><tspan x="0" y="0">audit lightly</tspan></text>
  <text class="st2" transform="translate(650 1792)"><tspan x="0" y="0">SECOND FOOD — the air</tspan></text>
  <text class="st44" transform="translate(650 1811)"><tspan x="0" y="0">notice, no more</tspan></text>
  <text class="st2" transform="translate(650 1842)"><tspan x="0" y="0">THIRD FOOD — IMPRESSIONS</tspan></text>
  <text class="st44" transform="translate(650 1861)"><tspan x="0" y="0">the food nobody audits: the real assignment</tspan></text>
  <text class="st47" transform="translate(650 1898)"><tspan x="0" y="0">An impression received asleep goes nowhere.</tspan></text>
  <text class="st47" transform="translate(650 1916.09)"><tspan x="0" y="0">Received in PRESENCE — at the exact point of entry</tspan></text>
  <text class="st47" transform="translate(650 1934.1801)"><tspan x="0" y="0">— it transforms: the FIRST CONSCIOUS SHOCK.</tspan></text>
  <text class="st47" transform="translate(650 1952.27)"><tspan x="0" y="0">Presence is metabolism.</tspan></text>
  <text class="st14" transform="translate(650 1978.36)"><tspan x="0" y="0">The yield: the machine’s finest fuel — the same</tspan></text>
  <text class="st14" transform="translate(650 1995.78)"><tspan x="0" y="0">premium energy the sex center runs on — the fuel</tspan></text>
  <text class="st14" transform="translate(650 2013.2)"><tspan x="0" y="0">of everything higher.</tspan></text>
  <text class="st6" transform="translate(650 2038.62)"><tspan x="0" y="0">So keep an IMPRESSION DIET: what enters the eyes</tspan></text>
  <text class="st6" transform="translate(650 2056.04)"><tspan x="0" y="0">and ears is what you become.</tspan></text>
  <rect class="st17" x="1540" y="1660" width="440" height="600" rx="16" ry="16"/>
  <text class="st45" transform="translate(1589.1494 1702)"><tspan x="0" y="0">LIVING IT — Part VI: nothing wasted</tspan></text>
  <text class="st47" transform="translate(1570 1742)"><tspan x="0" y="0">Friction is the gymnasium: the person who</tspan></text>
  <text class="st47" transform="translate(1570 1760.09)"><tspan x="0" y="0">irritates you is the equipment. Met with presence,</tspan></text>
  <text class="st47" transform="translate(1570 1778.1801)"><tspan x="0" y="0">difficulty becomes CONSCIOUS, INTENTIONAL</tspan></text>
  <text class="st47" transform="translate(1570 1796.27)"><tspan x="0" y="0">SUFFERING — payment, not loss.</tspan></text>
  <text class="st1" transform="translate(1570 1824.36)"><tspan x="0" y="0">THE SECOND CONSCIOUS SHOCK: negative emotion</tspan></text>
  <text class="st1" transform="translate(1570 1842.45)"><tspan x="0" y="0">caught at the instant of arising and transformed —</tspan></text>
  <text class="st1" transform="translate(1570 1860.54)"><tspan x="0" y="0">neither expressed nor suppressed.</tspan></text>
  <text class="st39" transform="translate(1570 1888.63)"><tspan x="0" y="0">INTERNAL CONSIDERING (keeping accounts of how you</tspan></text>
  <text class="st39" transform="translate(1570 1906.05)"><tspan x="0" y="0">are treated) is replaced by EXTERNAL CONSIDERING —</tspan></text>
  <text class="st39" transform="translate(1570 1923.47)"><tspan x="0" y="0">real attention to the other.</tspan></text>
  <text class="st6" transform="translate(1570 1950.89)"><tspan x="0" y="0">And keep the AIM warm — years, not weekends.</tspan></text>
  <rect class="st17" x="90" y="2130" width="470" height="360" rx="16" ry="16"/>
  <text class="st45" transform="translate(188.4487 2172)"><tspan x="0" y="0">HOW THE TURN FINDS YOU</tspan></text>
  <text class="st2" transform="translate(120 2210)"><tspan x="0" y="0">A influences arise inside ordinary life. B influences</tspan></text>
  <text class="st2" transform="translate(120 2228.76)"><tspan x="0" y="0">carry meaning IN from outside it. C influences pass</tspan></text>
  <text class="st2" transform="translate(120 2247.52)"><tspan x="0" y="0">only person to person.</tspan></text>
  <text class="st2" transform="translate(120 2274.28)"><tspan x="0" y="0">Something in you collects the B’s — the MAGNETIC</tspan></text>
  <text class="st2" transform="translate(120 2293.04)"><tspan x="0" y="0">CENTER — until one day it steers you to a book, a</tspan></text>
  <text class="st2" transform="translate(120 2311.8)"><tspan x="0" y="0">person, a way.</tspan></text>
  <text class="st36" transform="translate(120 2338.5601)"><tspan x="0" y="0">That is how this map found you.</tspan></text>
  <rect class="st17" x="90" y="1620" width="470" height="460" rx="16" ry="16"/>
  <text class="st45" transform="translate(242.0752 1662)"><tspan x="0" y="0">THE FOUR WAYS</tspan></text>
  <text class="st47" transform="translate(120 1700)"><tspan x="0" y="0">The fakir works the body; the monk, the heart; the yogi,</tspan></text>
  <text class="st47" transform="translate(120 1718.09)"><tspan x="0" y="0">the mind. Methods, not religions — each demands leaving</tspan></text>
  <text class="st47" transform="translate(120 1736.1801)"><tspan x="0" y="0">life, develops one center, and stays fragile.</tspan></text>
  <text class="st47" transform="translate(120 1762.27)"><tspan x="0" y="0">THE FOURTH WAY works all three centers at once, begins</tspan></text>
  <text class="st47" transform="translate(120 1780.36)"><tspan x="0" y="0">from understanding, and is built INSIDE life — so its</tspan></text>
  <text class="st47" transform="translate(120 1798.45)"><tspan x="0" y="0">results survive contact with life.</tspan></text>
  <text class="st36" transform="translate(120 1824.54)"><tspan x="0" y="0">It is the way of the SLY MAN — who knows what to take,</tspan></text>
  <text class="st36" transform="translate(120 1842.63)"><tspan x="0" y="0">and how, without leaving his kitchen.</tspan></text>
  <text class="st24" transform="translate(120 1870.72)"><tspan x="0" y="0">BELIEVE NOTHING. VERIFY EVERYTHING.</tspan></text>
  <rect class="st38" x="820" y="2320" width="1060" height="470" rx="18" ry="18"/>

  <text class="st8" transform="translate(860 2606)"><tspan x="0" y="0">each center has moving, emotional, and intellectual PARTS — attention’s three depths</tspan></text>

  <text class="st13" transform="translate(1540.6342 2602)"><tspan x="0" y="0">carriage · horse · driver — and the master’s seat, EMPTY</tspan></text>
  <text class="st31" transform="translate(1531.9233 2636)"><tspan x="0" y="0">ESSENCE (small, real) wears a PERSONALITY (large, borrowed)</tspan></text>
  <text class="st34" transform="translate(1514.0618 2658)"><tspan x="0" y="0">IDENTIFICATION is the glue; SLEEP is the state; the DREAM is the life</tspan></text>
  <text class="st12" transform="translate(981.5155 2762)"><tspan x="0" y="0">— and yet: under the buffers, CONSCIENCE — the felt truth of the whole being at once — never stopped waiting —</tspan></text>
  <line class="st19" x1="120" y1="2850" x2="2480" y2="2850"/>
  <text class="st48" transform="translate(807.6875 2900)"><tspan x="0" y="0">EVERY CHAPTER ENDS IN PRACTICE — first day · first week · first month · first year — Chapter 17 gathers THE WORK’s complete toolkit</tspan></text>
  <text class="st43" transform="translate(827.6632 2932)"><tspan x="0" y="0">the SECOND LINE OF WORK: with and for others (work groups, Appendix A) — knowledge and being must grow together into UNDERSTANDING</tspan></text>
  <text class="st37" transform="translate(1072.6764 2964)"><tspan x="0" y="0">read it three times: once as a story, once as a study, once as a practice</tspan></text>
  <text class="st15" transform="translate(1196.481 3062)"><tspan x="0" y="0">We are THIS.</tspan></text>

<script>
(function(){
'use strict';
var svg = document.getElementById('mapsvg');
var stage = document.getElementById('stage');
var lvlEl = document.getElementById('zoomlvl');
var MW = 2600, MH = 3400;               // map coordinate space
var vb = {x:0, y:0, w:MW, h:MH};        // current viewBox
var fitW = MW;                           // viewBox width at "fit" (set below)
var interacted = false;

function stageSize(){
  var vv = window.visualViewport;
  return { w: vv ? vv.width : window.innerWidth,
           h: vv ? vv.height : window.innerHeight };
}
function apply(){
  svg.setAttribute('viewBox', vb.x+' '+vb.y+' '+vb.w+' '+vb.h);
  lvlEl.textContent = Math.round(100 * fitW / vb.w) + '%';
}
function clamp(){
  var maxW = fitW * 1.6;                 // can zoom out a bit past fit
  var minW = fitW / 600;                 // effectively infinite zoom in
  if(vb.w > maxW){ var f = maxW/vb.w; vb.w = maxW; vb.h *= f; }
  if(vb.w < minW){ var f2 = minW/vb.w; vb.w = minW; vb.h *= f2; }
  // keep the map from being lost entirely off-screen
  var pad = vb.w * 0.35;
  vb.x = Math.max(-vb.w + pad, Math.min(MW - pad, vb.x));
  vb.y = Math.max(-vb.h + pad, Math.min(MH - pad, vb.y));
}
function fit(){
  var s = stageSize(), pad = 1.03;
  var mapAspect = MW/MH, scrAspect = s.w/s.h;
  if(scrAspect > mapAspect){ vb.h = MH*pad; vb.w = vb.h*scrAspect; }
  else { vb.w = MW*pad; vb.h = vb.w/scrAspect; }
  vb.x = (MW - vb.w)/2; vb.y = (MH - vb.h)/2;
  fitW = vb.w;
  apply();
}
function clientToMap(cx, cy){
  var r = stage.getBoundingClientRect();
  return { x: vb.x + (cx - r.left)/r.width * vb.w,
           y: vb.y + (cy - r.top)/r.height * vb.h };

function zoomAt(cx, cy, factor){
  interacted = true;
  var p = clientToMap(cx, cy);
  vb.w /= factor; vb.h /= factor;
  var r = stage.getBoundingClientRect();
  vb.x = p.x - (cx - r.left)/r.width * vb.w;
  vb.y = p.y - (cy - r.top)/r.height * vb.h;
  clamp(); apply();
}
function panPx(dx, dy){
  interacted = true;
  var r = stage.getBoundingClientRect();
  vb.x -= dx * vb.w / r.width;
  vb.y -= dy * vb.h / r.height;
  clamp(); apply();

// ---- pointers: 1 = pan, 2 = pinch-zoom + pan ----
var pointers = {};
var lastMid = null, lastDist = 0;
var lastTap = 0, lastTapX = 0, lastTapY = 0;
function pCount(){ return Object.keys(pointers).length; }

  var ids = Object.keys(pointers), a = pointers[ids[0]], b = pointers[ids[1]];

stage.addEventListener('pointerdown', function(e){
  e.preventDefault();

    var m = mid(); lastMid = m; lastDist = m.d;

  lastMid = null; lastDist = 0;
  if(pCount() === 0) stage.classList.remove('dragging');

stage.addEventListener('pointerup', endPointer);
stage.addEventListener('pointercancel', endPointer);
stage.addEventListener('pointermove', function(e){
  if(!(e.pointerId in pointers)) return;
  var prev = pointers[e.pointerId];
  pointers[e.pointerId] = {x:e.clientX, y:e.clientY};
  if(pCount() === 2){
    var m = mid();
    if(lastDist > 0) zoomAt(m.x, m.y, m.d / lastDist);
    if(lastMid) panPx(m.x - lastMid.x, m.y - lastMid.y);
    lastMid = m; lastDist = m.d;
  } else if(pCount() === 1){
    panPx(e.clientX - prev.x, e.clientY - prev.y);
  }
});
stage.addEventListener('wheel', function(e){
  e.preventDefault();
  zoomAt(e.clientX, e.clientY, Math.exp(-e.deltaY * 0.0016));
}, {passive:false});
stage.addEventListener('dblclick', function(e){
  e.preventDefault(); zoomAt(e.clientX, e.clientY, 2.2);
});

// ---- controls & keys ----
function centerZoom(f){
  var s = stageSize();
  zoomAt(s.w/2, s.h/2, f);
}
document.getElementById('zin').addEventListener('click', function(){ centerZoom(1.5); });
document.getElementById('zout').addEventListener('click', function(){ centerZoom(1/1.5); });
document.getElementById('zfit').addEventListener('click', function(){ fit(); });
window.addEventListener('keydown', function(e){
  if(e.key === '+' || e.key === '=') centerZoom(1.5);
  if(e.key === '-' || e.key === '_') centerZoom(1/1.5);
  if(e.key === '0' || e.key.toLowerCase() === 'f') fit();
});
function onResize(){ if(!interacted) fit(); else { clamp(); apply(); } }
window.addEventListener('resize', onResize);
if(window.visualViewport){
  window.visualViewport.addEventListener('resize', onResize);
}
fit();
console.log('great-map viewer v1');
})();
